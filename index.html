  } else {
    const titoli = { accedi: 'Accedi con l’email', registrati: 'Crea un account', recupera: 'Recupera la password' };
    const social = (GOOGLE_ATTIVO || APPLE_ATTIVO) && modoAccesso !== 'recupera';
    html += `<section class="card">
        <p>Con un account lo storico delle partite viene salvato nel cloud e lo ritrovi su ogni dispositivo. Senza account l’app funziona lo stesso, ma solo su questo telefono.</p>
        ${interruttoreRicordami()}
      </section>
      ${social ? `<section class="card">
        ${GOOGLE_ATTIVO ? `<button class="btn btn-social google btn-largo" data-azione="accedi-google">${LOGO_GOOGLE}Continua con Google</button>` : ''}
        ${APPLE_ATTIVO ? `<button class="btn btn-social apple btn-largo" data-azione="accedi-apple">${LOGO_APPLE}Continua con Apple</button>` : ''}
      </section>` : ''}
      <section class="card">
        <h2>${titoli[modoAccesso]}</h2>
        ${modoAccesso === 'recupera' ? '<p class="var">Scrivi l’email del tuo account: ti mandiamo un link per scegliere una nuova password.</p>' : ''}
        <form id="form-accesso" novalidate>
          <div class="tf" style="margin-top:20px"><input id="acc-email" type="email" autocomplete="email" inputmode="email" value="${esc(emailAccesso)}" aria-describedby="acc-msg"><label for="acc-email">Email</label></div>
          ${modoAccesso !== 'recupera' ? campoPassword('acc-password', 'Password', modoAccesso === 'registrati' ? 'new-password' : 'current-password', modoAccesso === 'registrati' ? 'acc-aiuto acc-msg' : 'acc-msg') : ''}
          ${modoAccesso === 'registrati' ? '<p class="supporto" id="acc-aiuto">Almeno 8 caratteri.</p>' : ''}
          <p class="supporto errore" id="acc-msg" role="alert"></p>
          <button class="btn btn-filled btn-largo" type="submit" style="margin-top:8px">${{ accedi: 'Accedi', registrati: 'Crea account', recupera: 'Invia il link' }[modoAccesso]}</button>
        </form>
        <div class="link-accesso">${modoAccesso === 'accedi'
          ? '<button class="btn btn-text" data-azione="modo-accesso" data-val="recupera">Password dimenticata?</button><button class="btn btn-text" data-azione="modo-accesso" data-val="registrati">Crea un account</button>'
          : '<button class="btn btn-text" data-azione="modo-accesso" data-val="accedi">Ho già un account: accedi</button>'}</div>
      </section>`;
  }
  $('#vista').innerHTML = html;
  azione('');
}

function messaggioAuth(e) {
  const testi = {
    invalid_credentials: 'Email o password non corrette.',
    email_not_confirmed: 'Prima devi confermare l’email: apri il link che ti abbiamo mandato.',
    user_already_exists: 'Esiste già un account con questa email: accedi oppure recupera la password.',
    email_exists: 'Esiste già un account con questa email: accedi oppure recupera la password.',
    weak_password: 'Password troppo debole: usa almeno 8 caratteri, meglio con numeri e simboli.',
    same_password: 'La nuova password deve essere diversa da quella attuale.',
    over_email_send_rate_limit: 'Sono state inviate troppe email: riprova più tardi.',
    email_address_not_authorized: 'Per ora non posso mandare email a questo indirizzo: l’invio delle email non è ancora attivo per tutti.',
    over_request_rate_limit: 'Troppi tentativi: aspetta qualche minuto e riprova.',
    signup_disabled: 'Le nuove registrazioni sono chiuse.',
    provider_disabled: 'Questo metodo di accesso non è ancora attivo.',
    reauthentication_needed: 'Per cambiare la password devi prima confermare la tua identità.'
  };
  if (e && testi[e.code]) return testi[e.code];
  if (e && (e.name === 'AuthRetryableFetchError' || e.status === 0)) return 'Nessuna connessione: controlla internet e riprova.';
  return 'Qualcosa non ha funzionato' + (e && e.message ? ': ' + e.message : '.');
}

async function accediConProvider(provider) {
  if (!supa) return;
  const { data, error } = await supa.auth.signInWithOAuth({ provider, options: { redirectTo: URL_APP, skipBrowserRedirect: true } });
  if (error) { avviso(messaggioAuth(error)); return; }
  vaiA(data.url);
}

async function inviaAccesso() {
  const msg = $('#acc-msg');
  const scrivi = (testo, errore = true) => { msg.textContent = testo; msg.classList.toggle('errore', errore); msg.classList.toggle('ok', !errore); };
  const email = $('#acc-email').value.trim();
  emailAccesso = email;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { scrivi('Scrivi un indirizzo email valido.'); $('#acc-email').focus(); return; }
  const bottone = $('#form-accesso button[type="submit"]');
  if (modoAccesso === 'recupera') {
    bottone.disabled = true;
    const { error } = await supa.auth.resetPasswordForEmail(email, { redirectTo: URL_APP });
    bottone.disabled = false;
    scrivi(error ? messaggioAuth(error) : 'Se l’indirizzo è registrato ti arriverà una mail con il link per scegliere una nuova password.', !!error);
    return;
  }
  const password = $('#acc-password').value;
  if (!password) { scrivi('Scrivi la password.'); $('#acc-password').focus(); return; }
  if (modoAccesso === 'registrati' && password.length < 8) { scrivi('La password deve avere almeno 8 caratteri.'); $('#acc-password').focus(); return; }
  bottone.disabled = true;
  const { data, error } = modoAccesso === 'registrati'
    ? await supa.auth.signUp({ email, password, options: { emailRedirectTo: URL_APP } })
    : await supa.auth.signInWithPassword({ email, password });
  if (!bottone.isConnected) return;   // la schermata è già cambiata: accesso riuscito
  bottone.disabled = false;
  if (error) { scrivi(messaggioAuth(error)); return; }
  if (!data.session) scrivi('Ti abbiamo mandato una mail di conferma: apri il link per attivare l’account.', false);
}

async function salvaNuovaPassword() {
  const msg = $('#np-msg');
  const password = $('#nuova-password').value;
  if (password.length < 8) { msg.textContent = 'La password deve avere almeno 8 caratteri.'; $('#nuova-password').focus(); return; }
  const { error } = await supa.auth.updateUser({ password });
  if (error) { msg.textContent = messaggioAuth(error); return; }
  recuperoPassword = false;
  avviso('Password aggiornata');
  if (location.hash.startsWith('#/account')) vistaAccount();
}

async function cambiaPassword() {
  const haPassword = (utente.identities || []).some(i => i.provider === 'email');
  const v = await dialogo({
    titolo: haPassword ? 'Cambia password' : 'Imposta una password',
    testo: haPassword ? 'Scegli una nuova password di almeno 8 caratteri.' : 'Così potrai entrare anche con email e password. Almeno 8 caratteri.',
    campo: { etichetta: 'Nuova password', valore: '', tipo: 'password', autocomplete: 'new-password', valida: x => x.length >= 8 ? '' : 'Servono almeno 8 caratteri.' },
    azioni: [{ testo: 'Annulla', valore: null }, { testo: 'Salva', valore: 'ok' }]
  });
  if (v === null) return;
  const { error } = await supa.auth.updateUser({ password: v });
  avviso(error ? messaggioAuth(error) : 'Password aggiornata');
}

async function esci() {
  if (!supa || !utente) return;
  const mio = utente.id;
  // prima di uscire si prova a salvare tutto, ma senza aspettare all'infinito
  await Promise.race([sincronizza(), new Promise(r => setTimeout(r, 5000))]);
  const nonSalvate = dati.partite.filter(p => p.utente === mio && p.sincronizzata !== p.aggiornata).length;
  const { error } = await supa.auth.signOut({ scope: 'local' });
  if (error) { avviso(messaggioAuth(error)); return; }
  avviso(!nonSalvate ? 'Sei uscito: le tue partite restano al sicuro nel cloud.'
    : nonSalvate === 1 ? 'Sei uscito. 1 partita non ancora salvata resta su questo telefono.'
    : `Sei uscito. ${nonSalvate} partite non ancora salvate restano su questo telefono.`);
  vai('#/partite');
}

/* ---------- Gestione dei tocchi ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-azione]');
  if (!el) return;
  const a = el.dataset.azione;
  const i = el.dataset.i !== undefined ? intero(el.dataset.i) : null;

  switch (a) {
    case 'indietro': calc = null; vai(el.dataset.dest); break;
    case 'apri': vai('#/partita/' + el.dataset.id); break;
    case 'impostazioni': apriImpostazioni(); break;
    case 'testo':
      dati.testo = el.dataset.val; salva(); applicaTesto();
      $('#seg-testo').innerHTML = segmenti('Dimensione del testo', Object.entries(TESTO).map(([k, v]) => [k, v[0]]), dati.testo, 'testo');
      break;

    case 'aggiungi-giocatore':
      if (bozza.nomi.length < 4) bozza.nomi.push('');
      vistaNuova();
      $('#g' + (bozza.nomi.length - 1)).focus();
      break;
    case 'togli-giocatore':
      if (bozza.nomi.length > 2) bozza.nomi.splice(i, 1);
      if (bozza.compagno >= bozza.nomi.length) bozza.compagno = 1;
      vistaNuova();
      break;
    case 'compagno': bozza.compagno = intero(el.dataset.val); $('#coppie').innerHTML = htmlCoppie(); break;
    case 'regolamento-bozza':
      bozza.regolamento = el.dataset.val;
      bozza.minuti = minutiDaRegolamento(bozza.regolamento, bozza.smazzate);
      vistaNuova();
      break;
    case 'smazzate':
      bozza.smazzate = intero(el.dataset.val);
      bozza.minuti = minutiDaRegolamento(bozza.regolamento, bozza.smazzate);
      bozza.erroreMinuti = '';
      vistaNuova();
      document.querySelector(`[data-azione="smazzate"][data-val="${bozza.smazzate}"]`).focus();
      break;
    case 'avvia-tempo': avviaTempo(el.dataset.id); break;
    case 'cosa-fare': mostraCosaFare(trovaPartita(el.dataset.id), false); break;
    case 'traguardo':
      bozza.obiettivo = intero(el.dataset.val);
      $('#obiettivo').value = bozza.obiettivo;
      $('#traguardi').innerHTML = htmlTraguardi();
      break;
    case 'crea': creaPartita(); break;

    case 'regolamento': dati.regolamento = el.dataset.val; salva(); vistaRegole(); break;

    case 'cambia-traguardo': cambiaTraguardo(el.dataset.id); break;
    case 'nuova-manche': calc = null; vai('#/partita/' + el.dataset.id + '/manche'); break;
    case 'modifica-manche': calc = null; vai('#/partita/' + el.dataset.id + '/manche/' + el.dataset.n); break;
    case 'elimina-manche': {
      const p = trovaPartita(el.dataset.id);
      calc = null;
      conAnnulla('Manche eliminata', () => {
        p.manche.splice(intero(el.dataset.n), 1);
        p.aggiornata = Date.now();
        ricalcolaStato(p);
      });
      vai('#/partita/' + p.id);
      break;
    }
    case 'elimina-partita': {
      const id = el.dataset.id;
      conAnnulla('Partita eliminata', () => {
        const p = trovaPartita(id);
        // se la partita è dell'account, l'eliminazione va comunicata anche al cloud
        if (p && p.utente) dati.cancellate.push({ id, utente: p.utente, aggiornata: Date.now() });
        dati.partite = dati.partite.filter(q => q.id !== id);
      });
      vai('#/partite');
      break;
    }
    case 'rivincita': rivincita(el.dataset.id); break;

    case 'piu': case 'meno': {
      const d = calc.dettagli[i];
      const campo = el.dataset.campo;
      d[campo] = Math.max(0, d[campo] + (a === 'piu' ? 1 : -1));
      $(`#o-${campo}-${i}`).value = d[campo];
      aggiornaTotaleManche(i);
      break;
    }
    case 'modo': {
      const p = trovaPartita(calc.id);
      const man = el.dataset.val === 'manuale';
      calc.dettagli.forEach(d => {
        if (man && !d.manuale) d.totaleManuale = puntiAuto(d, p.regolamento);
        d.manuale = man;
      });
      vistaManche(calc.id, calc.n);
      break;
    }
    case 'conta': apriConta(i, el.dataset.campo); break;
    case 'conta-piu': case 'conta-meno': case 'conta-azzera': {
      if (a === 'conta-azzera') contaTemp = {};
      else {
        const c = el.dataset.carta;
        contaTemp[c] = Math.max(0, (contaTemp[c] || 0) + (a === 'conta-piu' ? 1 : -1));
      }
      $('#conta-box').innerHTML = htmlConta();
      const stesso = document.querySelector(`#conta-box [data-azione="${a}"]${el.dataset.carta ? `[data-carta="${el.dataset.carta}"]` : ''}`);
      if (stesso) stesso.focus();
      break;
    }
    case 'salva-manche': salvaManche(); break;

    case 'chat-nuova': if (!chat.inCorso) { chat = { vista: [], inCorso: false }; vistaChiedi(); } break;
    case 'chat-suggerimento': chiediAlRegolamento(el.dataset.testo); break;

    case 'accedi-google': accediConProvider('google'); break;
    case 'accedi-apple': accediConProvider('apple'); break;
    case 'modo-accesso': {
      const campo = $('#acc-email');
      if (campo) emailAccesso = campo.value.trim();
      modoAccesso = el.dataset.val;
      vistaAccount();
      break;
    }
    case 'mostra-password': {
      const campo = document.getElementById(el.dataset.campoId);
      const visibile = campo.type === 'password';
      campo.type = visibile ? 'text' : 'password';
      el.setAttribute('aria-pressed', String(visibile));
      el.setAttribute('aria-label', visibile ? 'Nascondi la password' : 'Mostra la password');
      el.innerHTML = visibile ? ICO.occhioNo : ICO.occhio;
      break;
    }
    case 'sincronizza': sincronizza(); break;
    case 'cambia-password': cambiaPassword(); break;
    case 'esci': esci(); break;
    case 'account-riprova': statoAccount = 'spento'; avviaAccount(); vistaAccount(); break;
  }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'form-accesso') { e.preventDefault(); inviaAccesso(); return; }
  if (e.target.id === 'form-nuova-password') { e.preventDefault(); salvaNuovaPassword(); return; }
  if (e.target.id !== 'chat-form') return;
  e.preventDefault();
  const t = $('#chat-testo');
  const domanda = t.value;
  t.value = '';
  chiediAlRegolamento(domanda);
});

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-azione]')) { e.preventDefault(); e.target.click(); }
  // Invio manda la domanda, Maiusc+Invio va a capo
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-testo') { e.preventDefault(); $('#chat-form').requestSubmit(); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'chat-testo') { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; return; }
  // numero di carte scritto a mano nel dialogo "Conta le carte"
  if (el.dataset.contaNum) {
    contaTemp[el.dataset.contaNum] = Math.max(0, intero(el.value));
    $('#conta-tot').textContent = sommaCarte(contaTemp);
    return;
  }
  const campo = el.dataset.campo;
  if (!campo) return;
  if (campo === 'nome') {
    bozza.nomi[intero(el.dataset.i)] = el.value;
    const c = $('#coppie');
    if (c) c.innerHTML = htmlCoppie();
  } else if (campo === 'obiettivo') {
    bozza.obiettivo = el.value;
    $('#traguardi').innerHTML = htmlTraguardi();
  } else if (campo === 'minuti') {
    bozza.minuti = el.value;
  } else if (calc && campo === 'totaleDiretto') {
    // riquadro della calcolatrice: se è compilato vale il totale scritto, se è vuoto torna il calcolo
    const d = calc.dettagli[intero(el.dataset.i)];
    d.manuale = el.value.trim() !== '';
    d.totaleManuale = d.manuale ? intero(el.value) : 0;
    aggiornaTotaleManche(intero(el.dataset.i));
  } else if (calc && ['terra', 'mano', 'nonGiocato', 'totaleManuale', 'puliti', 'semipuliti', 'sporchi', 'superb', 'reali'].includes(campo)) {
    calc.dettagli[intero(el.dataset.i)][campo] = campo === 'totaleManuale' ? intero(el.value) : Math.max(0, intero(el.value));
    aggiornaTotaleManche(intero(el.dataset.i));
  }
});

// nei contatori + e − il numero si seleziona al tocco, così si scrive direttamente sopra
document.addEventListener('focusin', e => {
  if (e.target.matches('.stepper input')) e.target.select();
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.azioneSwitch === 'ricordami') { impostaRicordami(el.checked); return; }
  if (el.dataset.azioneSwitch === 'a-tempo') { bozza.aTempo = el.checked; vistaNuova(); $('#a-tempo').focus(); return; }
  if (!calc || el.type !== 'checkbox') return;
  const i = intero(el.dataset.i);
  const campo = el.dataset.campo;
  calc.dettagli[i][campo] = el.checked;
  const pozzetto = j => document.querySelector(`input[data-campo="pozzetto"][data-i="${j}"]`);
  const nonGiocato = j => document.querySelector(`input[data-campo="nonGiocato"][data-i="${j}"]`);
  // chi non ha preso il pozzetto non può averlo "preso e non giocato"
  const bloccaNonGiocato = j => {
    const ng = nonGiocato(j);
    if (calc.dettagli[j].pozzetto) calc.dettagli[j].nonGiocato = 0;
    if (ng) { ng.disabled = calc.dettagli[j].pozzetto; if (ng.disabled) ng.value = ''; }
  };
  if (campo === 'pozzetto') bloccaNonGiocato(i);
  if (campo === 'chiusura') {
    // chi chiude ha per forza preso il pozzetto: spengo e blocco "pozzetto non preso"
    if (el.checked) calc.dettagli[i].pozzetto = false;
    const pz = pozzetto(i);
    if (pz) { pz.checked = calc.dettagli[i].pozzetto; pz.disabled = el.checked; }
    bloccaNonGiocato(i);
    // può chiudere una sola squadra: tolgo la chiusura agli altri
    if (el.checked) {
      calc.dettagli.forEach((d, j) => {
        if (j !== i && d.chiusura) {
          d.chiusura = false;
          const altro = document.querySelector(`input[data-campo="chiusura"][data-i="${j}"]`);
          if (altro) altro.checked = false;
          const pzAltro = pozzetto(j);
          if (pzAltro) pzAltro.disabled = false;
          aggiornaTotaleManche(j);
        }
      });
    }
  }
  aggiornaTotaleManche(i);
});

applicaTesto();
window.addEventListener('hashchange', mostra);
mostra();
avviaAccount();
window.addEventListener('online', () => sincronizza());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  sincronizza();
  controllaTempi();
  tieniSchermoAcceso();
});
setInterval(controllaTempi, 1000);
controllaTempi();
tieniSchermoAcceso();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
