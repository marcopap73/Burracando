<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burracando</title>
<meta name="description" content="Segnapunti per il Burraco: regole di conteggio, partite a 2, 3 o 4 giocatori, storico delle manche e totali.">
<meta name="theme-color" content="#174b36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<style>
  /* Material Design 3, schema verde ricavato dal feltro del tavolo.
     I colori "on-" sono pensati per superare il contrasto 4.5:1 sul loro sfondo. */
  :root {
    --felt: #0d4a30;
    --felt-alto: #13643f;
    --felt-basso: #08351f;
    --on-felt: #ffffff;
    --on-felt-var: #c4e3cf;
    --nav: #072c1a;
    --nav-ind: #1f5a3c;
    --nav-on: #d6efdd;

    --primary: #006d3b;
    --on-primary: #ffffff;
    --primary-c: #9af5b5;
    --on-primary-c: #00210e;
    --secondary-c: #d2e8d4;
    --on-secondary-c: #0d1f13;
    --oro-c: #ffdea6;
    --on-oro-c: #271900;
    --tertiary: #7b5800;
    --tertiary-c: #ffdea6;
    --on-tertiary-c: #271900;
    --error: #ba1a1a;
    --error-c: #ffdad6;
    --on-error-c: #410002;
    --surface: #f6fbf3;
    --surface-low: #ffffff;
    --surface-c: #f7faf6;
    --surface-high: #f4f7f2;
    --surface-highest: #dfe4dc;
    --on-surface: #171d18;
    --on-surface-var: #414941;
    --outline: #717970;
    --outline-var: #c0c9bf;
    --inverse-surface: #2c322d;
    --inverse-on: #edf2ea;
    --inverse-primary: #7edb9b;

    --elev-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
    --elev-3: 0 1px 3px rgba(0,0,0,.3), 0 4px 8px 3px rgba(0,0,0,.15);
    --font: "Roboto Flex", Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --ease: cubic-bezier(.2, 0, 0, 1);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 1rem;
    line-height: 1.5;
    letter-spacing: .01em;
    color: var(--on-surface);
    background: var(--felt);
    background-image: radial-gradient(120% 70% at 50% 0%, var(--felt-alto) 0%, var(--felt) 55%, var(--felt-basso) 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .app { max-width: 600px; margin: 0 auto; padding: 0 16px calc(176px + env(safe-area-inset-bottom)); }
  body.senza-nav .app { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
  h1, h2, h3, p { margin: 0; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--inverse-primary); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums lining-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { fill: currentColor; flex: none; }

  /* Barra superiore */
  .topbar { display: flex; align-items: center; gap: 4px; min-height: 64px; padding: calc(8px + env(safe-area-inset-top)) 0 8px; color: var(--on-felt); margin: 0 -8px; }
  .topbar .titolo { flex: 1; min-width: 0; padding: 0 8px; }
  .topbar h1 { font-size: 1.375rem; font-weight: 500; line-height: 1.27; overflow-wrap: anywhere; }
  .topbar .sotto { font-size: .875rem; color: var(--on-felt-var); }
  .topbar.grande h1 { font-size: 1.75rem; font-weight: 600; }
  .topbar .logo { width: 48px; height: 48px; margin-left: 8px; }
  .icon-btn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: inherit; position: relative; flex: none; text-decoration: none; }
  .icon-btn svg { width: 24px; height: 24px; }
  .icon-btn:hover { background: rgba(255,255,255,.08); }
  .icon-btn:active { background: rgba(255,255,255,.14); }

  /* Card */
  .card { background: var(--surface-low); color: var(--on-surface); border-radius: 24px; padding: 20px; margin-bottom: 12px; box-shadow: var(--elev-1); }
  .card h2 { font-size: 1.375rem; font-weight: 500; line-height: 1.27; margin-bottom: 12px; }
  .card h3 { font-size: 1rem; font-weight: 600; margin: 16px 0 4px; }
  .card p + p { margin-top: 8px; }
  .var { color: var(--on-surface-var); }
  .piccolo { font-size: .875rem; line-height: 1.43; }
  .titolo-sezione { color: var(--on-felt); font-size: 1rem; font-weight: 600; margin: 24px 4px 12px; letter-spacing: .01em; }

  /* Pulsanti */
  .btn { min-height: 48px; padding: 0 24px; border-radius: 999px; border: 0; font-weight: 600; font-size: .9375rem; letter-spacing: .01em; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; position: relative; overflow: hidden; transition: box-shadow .2s var(--ease), background-color .2s var(--ease); }
  .btn svg { width: 20px; height: 20px; }
  .btn::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
  .btn:hover::after { opacity: .08; }
  .btn:active::after { opacity: .12; }
  .btn-filled { background: var(--primary); color: var(--on-primary); }
  .btn-tonal { background: var(--secondary-c); color: var(--on-secondary-c); }
  .btn-outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
  .btn-text { background: transparent; color: var(--primary); padding: 0 12px; }
  .btn-text.errore { color: var(--error); }
  .btn-largo { width: 100%; }

  /* Pulsante d'azione flottante (FAB esteso) e azione in fondo */
  .azione { position: fixed; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 5; pointer-events: none; }
  .azione > div { max-width: 600px; margin: 0 auto; padding: 0 16px; display: flex; justify-content: flex-end; }
  .azione .btn { pointer-events: auto; }
  .fab { min-height: 56px; border-radius: 16px; padding: 0 20px 0 16px; background: var(--oro-c); color: var(--on-oro-c); box-shadow: var(--elev-3); font-size: 1rem; }
  .fab svg { width: 24px; height: 24px; }
  .azione.piena .btn { width: 100%; }
  body.senza-nav .azione { bottom: calc(16px + env(safe-area-inset-bottom)); }

  /* Barra di navigazione */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--nav); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  .nav ul { list-style: none; margin: 0 auto; padding: 0; display: flex; max-width: 600px; }
  .nav li { flex: 1; }
  .nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 80px; color: var(--nav-on); text-decoration: none; font-size: .75rem; font-weight: 600; letter-spacing: .03em; }
  .nav .ind { width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background-color .2s var(--ease); }
  .nav svg { width: 24px; height: 24px; }
  .nav a[aria-current="page"] { color: #fff; }
  .nav a[aria-current="page"] .ind { background: var(--nav-ind); }
  body.senza-nav .nav { display: none; }

  /* Avatar con iniziali */
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 600; font-size: 1rem; flex: none; border: 2px solid var(--surface-low); }
  .avatar.grande { width: 56px; height: 56px; font-size: 1.375rem; }
  .avatars { display: inline-flex; }
  .avatars .avatar + .avatar { margin-left: -12px; }
  .av0 { background: #b7f1c8; color: #00210e; }
  .av1 { background: #ffdea6; color: #271900; }
  .av2 { background: #d3e3fd; color: #041e49; }
  .av3 { background: #ffdad6; color: #410002; }

  /* Elenco partite */
  .partita-voce { display: block; width: 100%; text-align: left; border: 0; font: inherit; position: relative; overflow: hidden; }
  .partita-voce::after { content: ""; position: absolute; inset: 0; background: var(--on-surface); opacity: 0; transition: opacity .15s; }
  .partita-voce:hover::after { opacity: .04; }
  .partita-voce:active::after { opacity: .1; }
  .voce-testa { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .riga-squadra { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .riga-squadra .nome { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 1rem; }
  .riga-squadra .punti { font-size: 1.375rem; font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 8px; font-size: .875rem; font-weight: 600; border: 1px solid var(--outline-var); color: var(--on-surface-var); background: transparent; white-space: nowrap; }
  .chip svg { width: 18px; height: 18px; }
  .chip.pieno { background: var(--secondary-c); color: var(--on-secondary-c); border-color: transparent; }
  .chip.oro { background: var(--tertiary-c); color: var(--on-tertiary-c); border-color: transparent; }
  .chip-felt { color: var(--on-felt); border-color: rgba(255,255,255,.35); }
  button.chip { min-height: 44px; }
  button.chip-felt:hover { background: rgba(255,255,255,.08); }
  .vuoto { text-align: center; padding: 32px 20px; }
  .vuoto svg { width: 96px; height: 96px; margin-bottom: 12px; }

  /* Campi di testo (stile "outlined") */
  .tf { position: relative; margin-top: 8px; }
  .tf input { width: 100%; height: 56px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--outline); background: transparent; color: var(--on-surface); font-size: 1rem; }
  .tf input:hover { border-color: var(--on-surface); }
  .tf input:focus { outline: none; border: 2px solid var(--primary); padding: 0 15px; }
  .tf label { position: absolute; left: 12px; top: -9px; padding: 0 4px; background: var(--surface-low); color: var(--on-surface-var); font-size: .75rem; font-weight: 500; line-height: 16px; pointer-events: none; }
  .tf input:focus + label { color: var(--primary); }
  .tf.con-icona input { padding-right: 52px; }
  .tf .icon-btn { position: absolute; right: 4px; top: 4px; color: var(--on-surface-var); }
  .tf .icon-btn:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .tf .icon-btn:disabled { opacity: .38; cursor: default; }
  .supporto { font-size: .8125rem; color: var(--on-surface-var); margin: 4px 16px 0; line-height: 1.4; }
  .supporto.errore { color: var(--error); font-weight: 600; }
  .giocatori .tf + .tf { margin-top: 20px; }
  .info-banner { display: flex; gap: 12px; align-items: center; background: var(--secondary-c); color: var(--on-secondary-c); padding: 12px 16px; border-radius: 16px; margin-top: 16px; font-weight: 600; }
  .info-banner svg { width: 24px; height: 24px; }
  .campo-num { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--outline); background: transparent; text-align: center; font-size: 1.125rem; font-weight: 600; color: var(--on-surface); padding: 0 8px; }
  .campo-num:focus { outline: none; border: 2px solid var(--primary); }

  /* Pulsanti segmentati */
  .seg { display: flex; border: 1px solid var(--outline); border-radius: 999px; overflow: hidden; }
  .seg button { flex: 1; min-height: 48px; border: 0; background: transparent; color: var(--on-surface); font-weight: 600; font-size: .875rem; padding: 4px 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.2; min-width: 0; }
  .seg button + button { border-left: 1px solid var(--outline); }
  .seg button svg { width: 18px; height: 18px; }
  .seg button[aria-pressed="true"] { background: var(--secondary-c); color: var(--on-secondary-c); }
  .seg button span { overflow-wrap: anywhere; }
  .seg.verticale { flex-direction: column; border-radius: 16px; }
  .seg.verticale button { justify-content: flex-start; padding: 4px 16px; min-height: 52px; font-size: .9375rem; }
  .seg.verticale button + button { border-left: 0; border-top: 1px solid var(--outline); }

  /* Chip filtro */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--outline); background: transparent; color: var(--on-surface-var); font-weight: 600; font-size: .9375rem; display: inline-flex; align-items: center; gap: 6px; }
  .chips button svg { width: 18px; height: 18px; }
  .chips button[aria-pressed="true"] { background: var(--secondary-c); color: var(--on-secondary-c); border-color: transparent; }

  /* Tabellone della partita */
  .tabellone { display: grid; gap: 12px; grid-template-columns: repeat(var(--n), 1fr); }
  .squadra { background: var(--surface-low); border-radius: 24px; padding: 16px 12px; text-align: center; box-shadow: var(--elev-1); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .squadra.in-testa { background: var(--primary-c); color: var(--on-primary-c); }
  .squadra.in-testa .avatar { border-color: var(--primary-c); }
  .squadra .nome { font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; line-height: 1.3; }
  .squadra .totale { font-size: 2.8rem; font-weight: 400; line-height: 1.1; letter-spacing: -.01em; }
  .tabellone[style*="--n:3"] .squadra .totale { font-size: 2rem; }
  .squadra .totale.neg { color: var(--error); }
  .squadra .manca { font-size: .8125rem; opacity: .85; }
  .squadra .stato { min-height: 24px; }
  .chip-testa { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 700; background: var(--primary); color: var(--on-primary); border-radius: 999px; padding: 2px 10px; }
  .chip-testa svg { width: 14px; height: 14px; }
  .progresso { width: 100%; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--primary) 20%, transparent); overflow: hidden; margin-top: 6px; }
  .progresso span { display: block; height: 100%; border-radius: 2px; background: var(--primary); }
  .info-partita { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }

  .tabella-manche { width: 100%; border-collapse: collapse; }
  .tabella-manche th, .tabella-manche td { padding: 12px 8px; text-align: right; border-bottom: 1px solid var(--outline-var); }
  .tabella-manche th:first-child, .tabella-manche td:first-child { text-align: left; color: var(--on-surface-var); width: 3em; padding-left: 4px; }
  .tabella-manche thead th { font-size: .8125rem; color: var(--on-surface-var); font-weight: 600; vertical-align: bottom; overflow-wrap: anywhere; }
  .tabella-manche tbody tr { cursor: pointer; }
  .tabella-manche tbody tr:hover { background: color-mix(in srgb, var(--on-surface) 4%, transparent); }
  .tabella-manche tbody tr:active { background: color-mix(in srgb, var(--on-surface) 10%, transparent); }
  .tabella-manche td { font-size: 1rem; }
  .tabella-manche td.neg { color: var(--error); }
  .tabella-manche tfoot td { font-weight: 700; font-size: 1.125rem; border-bottom: 0; border-top: 2px solid var(--primary); }
  .tabella-manche .modifica { width: 40px; color: var(--on-surface-var); text-align: center; padding-right: 0; }
  .tabella-manche .modifica svg { width: 20px; height: 20px; vertical-align: middle; }

  /* Partita a tempo */
  .tempo-riga { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .tempo-ore { font-size: 3rem; font-weight: 500; line-height: 1.1; letter-spacing: -.01em; padding: 0 10px; margin-left: -10px; border-radius: 12px; }
  .tempo-ore.quasi { background: var(--oro-c); color: var(--on-oro-c); }
  .tempo-ore.scaduto { background: var(--error-c); color: var(--on-error-c); }
  .tempo-smazzata { font-size: 1rem; color: var(--on-surface-var); }
  .tempo-smazzata strong { color: var(--on-surface); font-size: 1.375rem; }
  .chip-felt svg { width: 18px; height: 18px; }

  .vincitore { text-align: center; background: var(--oro-c); color: var(--on-oro-c); }
  .vincitore svg.trofeo { width: 48px; height: 48px; }
  .vincitore h2 { margin: 8px 0 4px; }
  .vincitore .btn { margin-top: 16px; background: #271900; color: #ffdea6; }

  /* Calcolatrice: una colonna per giocatore */
  .calc-testa { position: sticky; top: 0; z-index: 4; background: var(--surface-c); border-radius: 24px; padding: 12px 12px 16px; margin: 0 0 12px; box-shadow: var(--elev-1); }
  .calc-testa .griglia { align-items: start; }
  .col-testa { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; min-width: 0; }
  .col-testa .nome { font-weight: 600; font-size: .9375rem; overflow-wrap: anywhere; line-height: 1.25; }
  .col-testa .totale { font-size: 2rem; font-weight: 500; line-height: 1.15; }
  .col-testa .totale.neg { color: var(--error); }
  .griglia { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px 12px; }
  .voce { padding: 14px 0; border-top: 1px solid var(--outline-var); }
  .voce:first-of-type { border-top: 0; padding-top: 0; }
  .voce-titolo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .voce-titolo strong { font-weight: 600; font-size: 1rem; }
  .voce-titolo span { font-size: .8125rem; color: var(--on-surface-var); text-align: right; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--secondary-c); color: var(--on-secondary-c); display: grid; place-items: center; flex: none; }
  .stepper button svg { width: 20px; height: 20px; }
  .stepper button:active { filter: brightness(.92); }
  .stepper output { min-width: 2ch; text-align: center; font-weight: 600; font-size: 1.375rem; }
  .stepper input { width: 3.2ch; min-width: 44px; height: 44px; padding: 0 2px; border: 1px solid var(--outline); border-radius: 10px; background: transparent; color: var(--on-surface); text-align: center; font-weight: 600; font-size: 1.375rem; flex: none; }
  .stepper input:focus { outline: none; border: 2px solid var(--primary); }
  .cella { display: flex; flex-direction: column; gap: 4px; align-items: stretch; min-width: 0; }
  .cella .btn-text { min-height: 44px; font-size: .8125rem; padding: 0 4px; gap: 4px; }
  .cella .btn-text svg { width: 18px; height: 18px; }
  .cella-switch { display: flex; justify-content: center; }
  .riepilogo { font-size: .8125rem; color: var(--on-surface-var); text-align: center; margin-top: 2px; overflow-wrap: anywhere; }

  /* Interruttore Material 3 */
  .switch { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 16px; border: 2px solid var(--outline); background: var(--surface-highest); position: relative; margin: 8px 0; cursor: pointer; transition: background-color .2s var(--ease), border-color .2s var(--ease); flex: none; }
  .switch::before { content: ""; position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); transform: translateY(-50%); transition: all .2s var(--ease); }
  .switch:checked { background: var(--primary); border-color: var(--primary); }
  .switch:checked::before { left: 22px; width: 24px; height: 24px; background: var(--on-primary); }
  .switch.malus:checked { background: var(--error); border-color: var(--error); }
  .switch.malus:checked::before { background: var(--surface-low); }
  .switch:focus-visible { outline-offset: 3px; }
  .switch:disabled { opacity: .38; cursor: not-allowed; }

  /* Regole */
  .lista-valori { list-style: none; margin: 0; padding: 0; }
  .lista-valori li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--outline-var); }
  .lista-valori li:first-child { border-top: 0; }
  .lista-valori .testo { flex: 1; min-width: 0; }
  .lista-valori .testo strong { display: block; font-weight: 600; }
  .lista-valori .testo span { font-size: .875rem; color: var(--on-surface-var); }
  .lista-valori .valore { font-size: 1.375rem; font-weight: 600; white-space: nowrap; }
  .premio { color: var(--primary); }
  .malus-txt { color: var(--error); }
  .mini-carte { display: flex; gap: 4px; margin-bottom: 4px; }
  .mini-carta { display: inline-grid; place-items: center; min-width: 30px; height: 40px; padding: 0 4px; border-radius: 6px; background: #fff; border: 1px solid #c9c9c9; font-weight: 700; font-size: .875rem; color: #1b1b1b; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  .mini-carta.rossa { color: #b3261e; }
  .mini-carta.jolly { color: #7b5800; font-size: .65rem; }
  .esempio { background: var(--surface-high); border-radius: 16px; padding: 12px 16px; margin-top: 12px; }
  .esempio strong { display: block; margin-bottom: 2px; }
  .risposta { background: var(--primary-c); color: var(--on-primary-c); border-radius: 16px; padding: 14px 16px; margin: 12px 0; }
  .card ul { margin: 8px 0 0; padding-left: 20px; }
  .card li { margin-bottom: 6px; }

  /* Finestra di dialogo */
  dialog { border: 0; border-radius: 28px; padding: 24px; width: min(92vw, 400px); max-height: 88vh; overflow: auto; background: var(--surface-high); color: var(--on-surface); box-shadow: var(--elev-3); }
  dialog::backdrop { background: rgba(0,0,0,.5); }

/* ---------- Dati salvati sul telefono ---------- */
const CHIAVE = 'burracando-dati';
let dati = carica();

function carica() {
  try {
    const testo = localStorage.getItem(CHIAVE);
    if (testo) {
      const d = JSON.parse(testo);
      if (d && Array.isArray(d.partite)) {
        // le prime versioni chiamavano "semipulito" quello che è il regolamento italiano FIBUR
        if (d.regolamento === 'semipulito') d.regolamento = 'italiano';
        d.partite.forEach(p => { if (p.regolamento === 'semipulito') p.regolamento = 'italiano'; });
        return Object.assign({ regolamento: 'italiano', testo: 'normale', cancellate: [] }, d);
      }
    }
  } catch (e) { /* memoria non disponibile: si parte vuoti */ }
  return { partite: [], regolamento: 'italiano', testo: 'normale', cancellate: [] };
}

function salva() {
  scriviLocale();
  programmaSincronizzazione();
}

function scriviLocale() {
  try { localStorage.setItem(CHIAVE, JSON.stringify(dati)); }
  catch (e) { avviso('Attenzione: non riesco a salvare sul dispositivo'); }
}

function applicaTesto() {
  document.documentElement.style.fontSize = (TESTO[dati.testo] || TESTO.normale)[1];
}

/* ---------- Utilità ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('it-IT');
const intero = v => { const n = parseInt(String(v).replace(/[^\d-]/g, ''), 10); return isNaN(n) ? 0 : n; };
const nuovoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dataBreve = ms => new Date(ms).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
const iniziale = nome => (nome.trim()[0] || '?').toUpperCase();

function trovaPartita(id) { return dati.partite.find(p => p.id === id); }
function nomeSquadra(p, i) { return p.squadre[i].membri.map(m => p.giocatori[m]).join(' e '); }
function totali(p) { return p.squadre.map((_, i) => p.manche.reduce((s, m) => s + (m.punti[i] || 0), 0)); }
function esitoBreve(p) { return p.vincitore === null ? 'Pareggio' : 'Vince ' + esc(nomeSquadra(p, p.vincitore)); }
function avatarSquadra(p, i, grande) {
  return `<span class="avatars" aria-hidden="true">${p.squadre[i].membri.map(m =>
    `<span class="avatar av${m}${grande ? ' grande' : ''}">${esc(iniziale(p.giocatori[m]))}</span>`).join('')}</span>`;
}

/* La partita finisce quando qualcuno arriva al punteggio per vincere
   ed è da solo in testa; in caso di parità in testa si gioca un'altra manche.
   A tempo invece finisce dopo l'ultima smazzata o dopo la smazzata del time out:
   vince chi ha più punti, e la parità resta pareggio (vincitore null). */
function ricalcolaStato(p) {
  const t = totali(p);
  const max = Math.max(...t);
  const primi = t.filter(x => x === max).length;
  if (p.tempo) {
    const dopoTimeOut = p.tempo.mancheAlTimeOut != null && p.manche.length > p.tempo.mancheAlTimeOut;
    p.finita = p.manche.length > 0 && (p.manche.length >= p.tempo.smazzate || dopoTimeOut);
    p.vincitore = p.finita && primi === 1 ? t.indexOf(max) : null;
    return;
  }
  if (max >= p.obiettivo && primi === 1) {
    p.finita = true;
    p.vincitore = t.indexOf(max);
  } else {
    p.finita = false;
    p.vincitore = null;
  }
}

function segmenti(aria, opzioni, attivo, azione, extra = '', verticale = false) {
  return `<div class="seg${verticale ? ' verticale' : ''}" role="group" aria-label="${esc(aria)}">${opzioni.map(([val, testo]) => {
    const on = String(val) === String(attivo);
    return `<button type="button" data-azione="${azione}" data-val="${esc(val)}" ${extra} aria-pressed="${on}">${on ? ICO.check : ''}<span>${testo}</span></button>`;
  }).join('')}</div>`;
}

function testata(titolo, sotto, indietro, azioni = '') {
  const inizio = indietro
    ? `<button class="icon-btn" data-azione="indietro" data-dest="${esc(indietro)}" aria-label="Indietro">${ICO.indietro}</button>`
    : ICO.logo;
  return `<header class="topbar${indietro ? '' : ' grande'}">${inizio}
    <div class="titolo"><h1>${titolo}</h1>${sotto ? `<div class="sotto">${sotto}</div>` : ''}</div>${azioni}</header>`;
}

function azione(html, piena) {
  const b = $('#azione');
  b.hidden = !html;

}

/* Snackbar con eventuale azione (es. "Annulla") */
function avviso(testo, act) {
  const el = $('#snackbar');
  el.innerHTML = `<span>${esc(testo)}</span>${act ? `<button type="button">${esc(act.testo)}</button>` : ''}`;
  if (act) el.querySelector('button').onclick = () => { el.classList.remove('visibile'); act.fn(); };
  el.classList.add('visibile');
  clearTimeout(avviso.t);
  avviso.t = setTimeout(() => el.classList.remove('visibile'), act ? 6000 : 2800);
}

/* Esegue una modifica e offre "Annulla" nella snackbar */
function conAnnulla(testo, modifica) {
  const prima = JSON.stringify(dati);
  modifica();
  salva();
  avviso(testo, { testo: 'Annulla', fn: () => {
    const attuali = new Map(dati.partite.map(p => [p.id, JSON.stringify(p)]));
    dati = JSON.parse(prima);
    // le partite ripristinate contano come modificate adesso: così il ripristino vince anche nel cloud
    dati.partite.forEach(p => { if (attuali.get(p.id) !== JSON.stringify(p)) p.aggiornata = Date.now(); });
    salva(); mostra(); avviso('Ripristinato');
  } });
}

/* Finestra di dialogo Material: restituisce il valore del pulsante scelto,
   oppure il testo scritto se c'è un campo. */
function dialogo({ titolo, testo = '', icona = '', html = '', campo = null, azioni = [{ testo: 'OK', valore: 'ok' }] }) {
  return new Promise(risolvi => {
    const f = $('#dialogo');
    f.innerHTML = `${icona ? `<div class="dlg-icona">${icona}</div>` : ''}
      <h2 id="dlg-titolo">${titolo}</h2>
      ${testo ? `<p>${testo}</p>` : ''}
      ${html}
      ${campo ? `<div class="tf" style="margin-top:20px"><input id="dlg-in" type="${campo.tipo || 'text'}" autocomplete="${campo.autocomplete || 'off'}" inputmode="${campo.inputmode || 'text'}" value="${esc(campo.valore)}" aria-describedby="dlg-err"><label for="dlg-in">${campo.etichetta}</label></div><p class="supporto errore" id="dlg-err" aria-live="assertive"></p>` : ''}
      <div class="dlg-azioni">${azioni.map((a, k) => `<button type="button" class="btn btn-text" data-scelta="${k}">${a.testo}</button>`).join('')}</div>`;
    const chiudi = v => { f.onclick = null; f.oncancel = null; if (f.close) f.close(); else f.removeAttribute('open'); risolvi(v); };
    const conferma = k => {
      const a = azioni[k];
      if (campo && a.valore === 'ok') {
        const v = $('#dlg-in').value;
        const err = campo.valida ? campo.valida(v) : '';
        if (err) { $('#dlg-err').textContent = err; $('#dlg-in').focus(); return; }
        chiudi(v);
      } else chiudi(a.valore);
    };
    f.onclick = e => { const b = e.target.closest('[data-scelta]'); if (b) conferma(intero(b.dataset.scelta)); };
    f.oncancel = e => { e.preventDefault(); chiudi(null); };
    if (f.showModal) f.showModal(); else f.setAttribute('open', '');
    const inp = $('#dlg-in');
    if (inp) {
      inp.select();
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); conferma(azioni.findIndex(a => a.valore === 'ok')); } };
    }
  });
}

/* ---------- Calcolo della manche ---------- */
function vuotoDettaglio() {
  return { puliti: 0, semipuliti: 0, sporchi: 0, superb: 0, reali: 0, terra: 0, mano: 0, nonGiocato: 0, chiusura: false, pozzetto: false, manuale: false, totaleManuale: 0, contaTerra: null, contaMano: null, contaNonGiocato: null };
}
function puntiAuto(d, regolamento) {
  const R = regole(regolamento);
  return d.puliti * PUNTI.pulito
    + (R.semipulito ? d.semipuliti * PUNTI.semipulito : 0)
    + d.sporchi * PUNTI.sporco
    + (R.speciali ? d.superb * PUNTI.superb + d.reali * PUNTI.reale : 0)
    + intero(d.terra) - intero(d.mano)
    - (R.nonGiocato ? intero(d.nonGiocato) : 0)
    + (d.chiusura ? PUNTI.chiusura : 0)
    - (d.pozzetto ? PUNTI.pozzetto : 0);
}
function burrachiTotali(d, regolamento) {
  const R = regole(regolamento);
  return d.puliti + d.sporchi + (R.semipulito ? d.semipuliti : 0) + (R.speciali ? d.superb + d.reali : 0);
}
/* Chi chiude deve avere almeno un burraco (un pulito nell'internazionale): restituisce l'errore o '' */
function erroreChiusura(d, regolamento) {
  if (d.manuale || !d.chiusura) return '';
  if (regole(regolamento).serveIlPulito) {
    return d.puliti + (regole(regolamento).speciali ? d.superb + d.reali : 0) > 0 ? '' : 'Nel burraco internazionale per chiudere serve almeno un burraco pulito (Art. 16).';
  }
  return burrachiTotali(d, regolamento) > 0 ? '' : 'Per chiudere serve almeno un burraco (Art. 16).';
}
function puntiDettaglio(d, regolamento) {
  return d.manuale ? intero(d.totaleManuale) : puntiAuto(d, regolamento);
}
function sommaCarte(conta) {
  return CARTE.reduce((s, c) => s + (conta[c.chiave] || 0) * c.valore, 0);
}

let contaTemp = null; // conteggio carte aperto nella finestra

function vai(h) { location.hash = h; }

function mostra() {
  const [sez, id, sotto, n] = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  let pagina = null;
  let manche = false;
  if (sez === 'nuova') { vistaNuova(); pagina = 'nuova'; }
  else if (sez === 'regole') { vistaRegole(); pagina = 'regole'; }
  else if (sez === 'chiedi') { vistaChiedi(); pagina = 'chiedi'; }
  else if (sez === 'account' && accountAttivo()) vistaAccount();
  else if (sez === 'partita' && trovaPartita(id)) {
    if (sotto === 'manche') { manche = true; vistaManche(id, n === undefined ? null : intero(n)); }
    else vistaPartita(id);
  }
  else { vistaPartite(); pagina = 'partite'; }

  document.body.classList.toggle('senza-nav', manche);
  if (pagina !== 'chiedi') document.body.classList.remove('con-chat');
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === pagina) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
}

function vistaPartite() {
  const ordina = l => l.sort((a, b) => b.aggiornata - a.aggiornata);
  const inCorso = ordina(dati.partite.filter(p => !p.finita));
  const finite = ordina(dati.partite.filter(p => p.finita));
  let html = testata('Burracando', 'Il segnapunti del Burraco', null,
    `<button class="icon-btn" data-azione="impostazioni" aria-label="Dimensione del testo">${ICO.testo}</button>${bottoneAccount()}`);

  if (!dati.partite.length) {
    html += `<section class="card vuoto">
      ${ICO.illustrazione}
      <h2>Nessuna partita</h2>
      <p class="var">Crea una partita, inserisci i giocatori e segna i punti manche dopo manche.</p>
    </section>`;
  }
  if (inCorso.length) html += `<h2 class="titolo-sezione">In corso</h2>` + inCorso.map(vocePartita).join('');
  if (finite.length) html += `<h2 class="titolo-sezione">Finite</h2>` + finite.map(vocePartita).join('');

  $('#vista').innerHTML = html;
  azione(`<a class="btn fab" href="#/nuova">${ICO.piu}Nuova partita</a>`);
}

function vocePartita(p) {
  const t = totali(p);
  const max = Math.max(...t);
  const righe = p.squadre.map((_, i) => {
    const testa = p.manche.length && t[i] === max;
    return `<div class="riga-squadra">${avatarSquadra(p, i)}
      <span class="nome">${esc(nomeSquadra(p, i))}${testa ? `<span class="sr"> (in testa)</span>` : ''}</span>
      <span class="punti num${t[i] < 0 ? ' malus-txt' : ''}">${fmt(t[i])}</span></div>`;
  }).join('');
  let stato;
  if (p.finita) stato = `<span class="chip oro">${ICO.trofeo.replace('class="trofeo"', '')}${esitoBreve(p)}</span>`;
  else if (p.tempo && p.tempo.fine) stato = `<span class="chip pieno">${ICO.timer}<span data-timer="${p.id}">${testoTimer(p)}</span></span>`;
  else stato = `<span class="chip pieno">${p.manche.length} manche</span>`;
  const formula = p.tempo ? `a tempo, ${p.tempo.smazzate} smazzate` : `si vince a ${fmt(p.obiettivo)}`;
  return `<button class="card partita-voce" data-azione="apri" data-id="${p.id}">
    <div class="voce-testa"><span class="piccolo var">${dataBreve(p.creata)} · ${formula}</span>${stato}</div>
    ${righe}
  </button>`;
}

function htmlCoppie() {
  const nome = i => esc(bozza.nomi[i].trim() || `Giocatore ${i + 1}`);
  return `<p style="font-weight:600;margin-bottom:8px">Chi gioca in coppia con ${nome(0)}?</p>
    ${segmenti('Compagno del giocatore 1', [1, 2, 3].map(i => [i, nome(i)]), bozza.compagno, 'compagno')}
    <p class="supporto">Coppie: <strong>${nome(0)} e ${nome(bozza.compagno)}</strong> contro <strong>${[1, 2, 3].filter(i => i !== bozza.compagno).map(nome).join(' e ')}</strong></p>`;
}

function testoTempiRegolamento(reg) {
  const t = TEMPI[reg] || TEMPI.italiano;
  return `Da regolamento${reg === 'internazionale' ? ' internazionale' : ''}: ${Object.entries(t).map(([s, m]) => `${s} smazzate ${m} minuti`).join(', ')} (Art. 5).`;
}

function creaPartita() {
  const nomi = bozza.nomi.map((s, i) => s.trim() || `Giocatore ${i + 1}`);
  const obiettivo = bozza.aTempo ? 2005 : intero(bozza.obiettivo);
  const minuti = intero(bozza.minuti);
  if (bozza.aTempo && (minuti < 1 || minuti > 300)) {
    bozza.erroreMinuti = 'Scrivi un tempo tra 1 e 300 minuti.';
    vistaNuova();
    $('#minuti').focus();
    return;
  }
  if (obiettivo < 100) {
    bozza.errore = 'Scrivi un traguardo di almeno 100 punti.';
    vistaNuova();
    $('#obiettivo').focus();
    return;
  }
  let squadre;
  if (nomi.length === 4) squadre = [{ membri: [0, bozza.compagno] }, { membri: [1, 2, 3].filter(i => i !== bozza.compagno) }];
  else squadre = nomi.map((_, i) => ({ membri: [i] }));
  const p = { id: nuovoId(), creata: Date.now(), aggiornata: Date.now(), giocatori: nomi, squadre, regolamento: bozza.regolamento, obiettivo, manche: [], finita: false, vincitore: null };
  if (bozza.aTempo) p.tempo = nuovoTempo(bozza.smazzate, minuti);
  if (utente) p.utente = utente.id;
  dati.partite.push(p);
  salva();
  bozza = null;
  vai('#/partita/' + p.id);
}

/* ---------- Schermata: partita ---------- */
function vistaPartita(id) {
  const p = trovaPartita(id);
  const t = totali(p);
  const max = Math.max(...t);
  const titolo = p.squadre.map((_, i) => esc(nomeSquadra(p, i))).join(' vs ');

  const tabellone = `<div class="tabellone" style="--n:${p.squadre.length}">${p.squadre.map((_, i) => {
    const inTesta = p.manche.length && t[i] === max && !(p.finita && p.vincitore === null);
    const perc = Math.max(0, Math.min(100, t[i] / p.obiettivo * 100));
    const manca = p.obiettivo - t[i];
    let stato = '';
    if (p.finita && p.vincitore === i) stato = `<span class="chip-testa">${ICO.trofeo.replace('class="trofeo"', '')}Vince</span>`;
    else if (inTesta) stato = `<span class="chip-testa">${ICO.stella}In testa</span>`;
    return `<div class="squadra${inTesta ? ' in-testa' : ''}">
      ${avatarSquadra(p, i, true)}
      <div class="nome">${esc(nomeSquadra(p, i))}</div>
      <div class="totale num${t[i] < 0 ? ' neg' : ''}">${fmt(t[i])}</div>
      <div class="stato">${stato}</div>
      ${p.tempo ? '' : `<div class="progresso" role="progressbar" aria-label="Avanzamento di ${esc(nomeSquadra(p, i))}" aria-valuemin="0" aria-valuemax="${p.obiettivo}" aria-valuenow="${Math.max(0, t[i])}"><span style="width:${perc}%"></span></div>
      <div class="manca">${manca > 0 ? `mancano ${fmt(manca)}` : 'traguardo raggiunto'}</div>`}
    </div>`;
  }).join('')}</div>`;

  const info = `<div class="info-partita">
    <span class="chip chip-felt">${REGOLAMENTI[p.regolamento]}</span>
    ${p.tempo
      ? `<span class="chip chip-felt">${ICO.timer}${p.tempo.smazzate} smazzate in ${p.tempo.minuti} minuti</span>`
      : `<button class="chip chip-felt" data-azione="cambia-traguardo" data-id="${p.id}" aria-label="Si vince a ${fmt(p.obiettivo)}. Cambia traguardo">${ICO.matita}Si vince a ${fmt(p.obiettivo)}</button>`}
  </div>`;

  const vincitore = p.finita ? `<section class="card vincitore" style="margin-top:16px">
      ${ICO.trofeo}
      <h2>${esitoBreve(p)}</h2>
      <p class="num">${p.vincitore === null ? `${fmt(max)} punti a testa` : `con ${fmt(t[p.vincitore])} punti`} in ${p.manche.length} manche</p>
      <button class="btn" data-azione="rivincita" data-id="${p.id}">${ICO.ripeti}Rivincita, stessi giocatori</button>
    </section>` : '';

  let storico;
  if (!p.manche.length) {
    storico = `<section class="card"><h2>Storico manche</h2><p class="var">Nessuna manche ancora. A fine mano tocca “Aggiungi manche” e conta il tavolo di ognuno.</p></section>`;
  } else {
    storico = `<section class="card">
      <h2>Storico manche</h2>
      <p class="var piccolo" style="margin-bottom:8px">Tocca una manche per modificarla o eliminarla.</p>
      <table class="tabella-manche num">
        <thead><tr><th scope="col">#</th>${p.squadre.map((_, i) => `<th scope="col">${esc(nomeSquadra(p, i))}</th>`).join('')}<th scope="col"><span class="sr">Modifica</span></th></tr></thead>
        <tbody>${p.manche.map((m, n) => `<tr data-azione="modifica-manche" data-id="${p.id}" data-n="${n}" tabindex="0" aria-label="Manche ${n + 1}: ${m.punti.map((x, i) => `${esc(nomeSquadra(p, i))} ${fmt(x)}`).join(', ')}. Modifica">
          <td>${n + 1}</td>${m.punti.map(x => `<td class="${x < 0 ? 'neg' : ''}">${fmt(x)}</td>`).join('')}<td class="modifica">${ICO.matita}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Tot.</td>${t.map(x => `<td>${fmt(x)}</td>`).join('')}<td></td></tr></tfoot>
      </table>
    </section>`;
  }

  $('#vista').innerHTML = testata(titolo, `${p.manche.length} manche · ${dataBreve(p.creata)}`, '#/partite',
    `<button class="icon-btn" data-azione="elimina-partita" data-id="${p.id}" aria-label="Elimina partita">${ICO.cestino}</button>`)
    + tabellone + info + htmlTempo(p) + vincitore
    + `<h2 class="titolo-sezione">Manche</h2>` + storico;

  const dellUltima = p.tempo ? ` di ${p.tempo.smazzate}` : '';
  azione(p.finita ? '' : `<button class="btn fab" data-azione="nuova-manche" data-id="${p.id}">${ICO.piu}Aggiungi manche ${p.manche.length + 1}${dellUltima}</button>`);
}

/* ---------- Partite a tempo ---------- */
// "fine" è l'ora di scadenza (null finché non si avvia): così il tempo scorre anche ad app chiusa
// e su ogni dispositivo dell'account. "mancheAlTimeOut" è quante manche c'erano allo scadere.
function nuovoTempo(smazzate, minuti) {
  return { smazzate, minuti, fine: null, mancheAlTimeOut: null };
}

function testoTimer(p, ora = Date.now()) {
  if (!p.tempo.fine) return `${p.tempo.minuti}:00`;
  const resto = Math.max(0, Math.ceil((p.tempo.fine - ora) / 1000));
  if (!resto) return 'Time out';
  return `${Math.floor(resto / 60)}:${String(resto % 60).padStart(2, '0')}`;
}

function classeTimer(p, ora = Date.now()) {
  if (!p.tempo.fine) return '';
  const resto = p.tempo.fine - ora;
  return resto <= 0 ? 'scaduto' : resto <= 5 * 60000 ? 'quasi' : '';
}

function htmlTempo(p) {
  if (!p.tempo || p.finita) return '';
  const T = p.tempo;
  const smazzata = Math.min(p.manche.length + 1, T.smazzate);
  let sotto;
  if (!T.fine) sotto = `<p class="var piccolo">Avvialo quando il mazziere scopre la prima carta del tallone. Poi non si ferma più, neanche tra una smazzata e l’altra.</p>
      <button class="btn btn-filled btn-largo" data-azione="avvia-tempo" data-id="${p.id}" style="margin-top:12px">${ICO.timer}Avvia il tempo</button>`;
  else if (T.mancheAlTimeOut != null) sotto = `<p><strong>Tempo scaduto:</strong> finite questa smazzata e segnate i punti. È l’ultima.</p>
      <button class="btn btn-text" data-azione="cosa-fare" data-id="${p.id}" style="margin-top:4px">Cosa fare al time out</button>`;
  else sotto = `<p class="var piccolo">Il tempo scorre anche se chiudi l’app. Allo scadere suona e vi dice come finire.</p>`;
  return `<section class="card tempo" style="margin-top:16px">
      <div class="tempo-riga">
        <span class="tempo-ore num ${classeTimer(p)}" role="timer" aria-label="Tempo rimasto" data-timer="${p.id}">${testoTimer(p)}</span>
        <span class="tempo-smazzata">Smazzata <strong>${smazzata}</strong> di ${T.smazzate}</span>
      </div>
      ${sotto}
    </section>`;
}

function avviaTempo(id) {
  const p = trovaPartita(id);
  if (!p || !p.tempo || p.tempo.fine) return;
  sbloccaSuono();
  p.tempo.fine = Date.now() + p.tempo.minuti * 60000;
  p.aggiornata = Date.now();
  salva();
  vistaPartita(id);
  tieniSchermoAcceso();
  avviso(`Tempo avviato: ${p.tempo.minuti} minuti`);
}

/* Istruzioni sintetiche per il time out, dall'Art. 15 del codice scelto */
function istruzioniTimeOut(p) {
  const coppie = p.squadre.some(s => s.membri.length === 2);
  const finale = `<li><strong>Poi segnate i punti</strong> con “Aggiungi manche”: è l’ultima smazzata, vince chi ha più punti.</li>`;
  if (p.regolamento === 'internazionale') {
    return `<ol class="passi">
        <li><strong>Ultimo giro:</strong> ${coppie ? 'si fa un giro completo che parte dal compagno di chi deve pescare' : 'ognuno gioca ancora un turno, a partire da chi deve pescare'}. Se si stavano dando le carte, si gioca un giro completo.</li>
        <li><strong>Se nessuno chiude</strong> in questo giro, nessuno prende i 100 punti di chiusura.</li>
        ${finale}
      </ol><span class="fonte">Internazionale · Art. 15</span>`;
  }
  return `<ol class="passi">
      <li><strong>Ultimo giro:</strong> si gioca fino allo scarto di chi ha dato le carte, poi un altro giro completo che finisce di nuovo con il suo scarto. Se si stavano dando le carte, si gioca un giro completo.</li>
      <li><strong>Se nessuno chiude:</strong> niente 100 punti di chiusura, e chi non ha preso il pozzetto ha −100.</li>
      ${finale}
    </ol><span class="fonte">${p.regolamento === 'classico' ? 'Come nel codice italiano' : 'Codice italiano'} · Art. 15</span>`;
}

function mostraCosaFare(p, scaduto) {
  return dialogo({
    icona: ICO.timer,
    titolo: scaduto ? 'Time out!' : 'Cosa fare al time out',
    html: istruzioniTimeOut(p),
    azioni: [{ testo: 'Ho capito', valore: 'ok' }]
  });
}

async function timeOut(p) {
  p.tempo.mancheAlTimeOut = p.manche.length;
  p.aggiornata = Date.now();
  salva();
  suonaTimeOut();
  const [sez, id, sotto] = location.hash.replace(/^#\/?/, '').split('/');
  if (sez === 'partita' && id === p.id && !sotto) vistaPartita(p.id);
  else if (sez === 'partite' || !sez) vistaPartite();
  tieniSchermoAcceso();
  await mostraCosaFare(p, true);
}

// ogni secondo: aggiorna i cronometri visibili e controlla se qualche tempo è scaduto
function controllaTempi() {
  const ora = Date.now();
  document.querySelectorAll('[data-timer]').forEach(el => {
    const p = trovaPartita(el.dataset.timer);
    if (!p || !p.tempo) return;
    el.textContent = testoTimer(p, ora);
    if (el.classList.contains('tempo-ore')) el.className = `tempo-ore num ${classeTimer(p, ora)}`;
  });
  if ($('#dialogo').open) return;
  const scaduta = dati.partite.find(p => p.tempo && p.tempo.fine && !p.finita && p.tempo.mancheAlTimeOut == null && ora >= p.tempo.fine);
  if (scaduta) timeOut(scaduta);
}

/* Suono e vibrazione al time out. Il browser fa suonare solo dopo un tocco: l'audio si prepara su "Avvia il tempo". */
let audio = null;
function sbloccaSuono() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch (e) { audio = null; }
}
function suonaTimeOut() {
  if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 600]);
  if (!audio) return;
  try {
    if (audio.state === 'suspended') audio.resume();
    [0, 0.5, 1].forEach(t => {
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.35);
      o.connect(g).connect(audio.destination);
      o.start(audio.currentTime + t);
      o.stop(audio.currentTime + t + 0.4);
    });
  } catch (e) { /* senza audio resta la vibrazione */ }
}

/* Con un tempo in corso lo schermo resta acceso, così l'avviso arriva puntuale */
let bloccoSchermo = null;
async function tieniSchermoAcceso() {
  const inCorso = dati.partite.some(p => p.tempo && p.tempo.fine && !p.finita && p.tempo.mancheAlTimeOut == null);
  try {
    if (inCorso && !bloccoSchermo && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      bloccoSchermo = await navigator.wakeLock.request('screen');
      bloccoSchermo.addEventListener('release', () => { bloccoSchermo = null; });
    } else if (!inCorso && bloccoSchermo) {
      await bloccoSchermo.release();
      bloccoSchermo = null;
    }
  } catch (e) { bloccoSchermo = null; }
}

/* ---------- Schermata: calcolatrice della manche ---------- */
function vistaManche(id, n) {
  const p = trovaPartita(id);
  const esistente = n !== null && p.manche[n];
  if (!calc || calc.id !== id || calc.n !== n) {
    calc = {
      id, n,
      dettagli: p.squadre.map((_, i) => esistente && esistente.dettagli && esistente.dettagli[i]
        ? Object.assign(vuotoDettaglio(), JSON.parse(JSON.stringify(esistente.dettagli[i])))
        : Object.assign(vuotoDettaglio(), esistente ? { manuale: true, totaleManuale: esistente.punti[i] } : {}))
    };
  }
  const N = p.squadre.length;
  const numero = n === null ? p.manche.length + 1 : n + 1;
  const R = regole(p.regolamento);
  const manuale = calc.dettagli.every(d => d.manuale);
  const chi = i => esc(nomeSquadra(p, i));
  const colonne = f => `<div class="griglia" style="--n:${N}">${p.squadre.map((_, i) => f(i, calc.dettagli[i])).join('')}</div>`;

  const testaCol = colonne((i, d) => {
    const tot = puntiDettaglio(d, p.regolamento);
    return `<div class="col-testa">${avatarSquadra(p, i)}<span class="nome">${chi(i)}</span>
      <span class="totale num${tot < 0 ? ' neg' : ''}" id="t-${i}">${fmt(tot)}</span></div>`;
  });

  // Con 2 colonne i burrachi si contano con i pulsanti + e −, con 3 si scrivono (non c'è spazio)
  const burrachi = (campo, titolo, sotto) => `<div class="voce">
      <div class="voce-titolo"><strong>${titolo}</strong><span>${sotto}</span></div>
      ${colonne((i, d) => N <= 2
        ? `<div class="stepper">
            <button data-azione="meno" data-i="${i}" data-campo="${campo}" aria-label="Togli un ${titolo.toLowerCase()} a ${chi(i)}">${ICO.meno}</button>
            <input class="num" id="o-${campo}-${i}" data-campo="${campo}" data-i="${i}" inputmode="numeric" value="${d[campo]}" aria-label="${titolo} di ${chi(i)}">
            <button data-azione="piu" data-i="${i}" data-campo="${campo}" aria-label="Aggiungi un ${titolo.toLowerCase()} a ${chi(i)}">${ICO.piu}</button>
          </div>`
        : `<input class="campo-num num" id="i-${campo}-${i}" data-campo="${campo}" data-i="${i}" inputmode="numeric" value="${d[campo] || ''}" placeholder="0" aria-label="${titolo}, ${chi(i)}">`)}
    </div>`;

  const carte = (campo, titolo, sotto) => `<div class="voce">
      <div class="voce-titolo"><strong>${titolo}</strong><span>${sotto}</span></div>
      ${colonne((i, d) => `<div class="cella">
        <input class="campo-num num" id="i-${campo}-${i}" data-campo="${campo}" data-i="${i}" inputmode="numeric" value="${d[campo] || ''}" placeholder="0" aria-label="${titolo}, ${chi(i)}" ${campo === 'nonGiocato' && d.pozzetto ? 'disabled' : ''}>
        <button class="btn btn-text" data-azione="conta" data-i="${i}" data-campo="${campo}" aria-label="Conta le carte una per una: ${titolo.toLowerCase()} di ${chi(i)}">${ICO.carte}Conta</button>
      </div>`)}
    </div>`;

  const interruttore = (campo, titolo, sotto, malus, nota = '') => `<div class="voce">
      <div class="voce-titolo"><strong>${titolo}</strong><span>${sotto}</span></div>
      ${colonne((i, d) => `<div class="cella-switch"><input type="checkbox" role="switch" class="switch${malus ? ' malus' : ''}" data-campo="${campo}" data-i="${i}" ${d[campo] ? 'checked' : ''} ${campo === 'pozzetto' && d.chiusura ? 'disabled' : ''} aria-label="${titolo}: ${chi(i)}"></div>`)}
      ${nota}
    </div>`;

  const corpo = manuale
    ? `<section class="card">
        <div class="voce"><div class="voce-titolo"><strong>Totale della manche</strong><span>per un negativo scrivi il meno</span></div>
        ${colonne((i, d) => `<input class="campo-num num" id="i-totaleManuale-${i}" data-campo="totaleManuale" data-i="${i}" inputmode="text" value="${d.totaleManuale || ''}" placeholder="0" aria-label="Totale della manche, ${chi(i)}">`)}
        </div>
      </section>`
    : `<section class="card">
        <div class="voce"><div class="voce-titolo"><strong>Totale complessivo</strong><span>scritto a mano sostituisce il calcolo</span></div>
        ${colonne((i, d) => `<input class="campo-num num" id="i-totaleDiretto-${i}" data-campo="totaleDiretto" data-i="${i}" inputmode="text" value="${d.manuale ? d.totaleManuale : ''}" placeholder="auto" aria-label="Totale complessivo scritto a mano, ${chi(i)}">`)}
        </div>
      </section>
      <section class="card">
        <h2>Burrachi</h2>
        ${burrachi('puliti', 'Pulito', `+${PUNTI.pulito} · senza matte`)}
        ${R.semipulito ? burrachi('semipuliti', 'Semipulito', `+${PUNTI.semipulito} · matta prima o dopo 7 carte`) : ''}
        ${burrachi('sporchi', 'Sporco', `+${PUNTI.sporco} · con una matta`)}
        ${R.speciali ? burrachi('superb', 'Super burraco', `+${PUNTI.superb} · 8 carte uguali senza matte`) : ''}
        ${R.speciali ? burrachi('reali', 'Burraco reale', `+${PUNTI.reale} · da A a K senza matte`) : ''}
      </section>
      <section class="card">
        <h2>Carte</h2>
        ${carte('terra', 'A terra', 'si sommano, burrachi compresi')}
        ${carte('mano', 'In mano', 'si sottraggono')}
        ${R.nonGiocato ? carte('nonGiocato', 'Pozzetto non giocato', 'preso ma non calato: si sottrae') : ''}
      </section>
      <section class="card">
        <h2>Fine mano</h2>
        ${interruttore('chiusura', 'Ha chiuso', `+${PUNTI.chiusura}`, false, `<p class="supporto" style="margin:8px 0 0">${R.serveIlPulito ? 'Per chiudere serve almeno un burraco pulito.' : 'Per chiudere serve almeno un burraco.'}</p>`)}
        ${interruttore('pozzetto', 'Pozzetto non preso', `−${PUNTI.pozzetto}`, true, '<p class="supporto" style="margin:8px 0 0">Chi ha chiuso ha preso per forza il pozzetto.</p>')}
        <div class="voce">${colonne((i, d) => `<p class="riepilogo num" id="r-${i}">${riepilogo(d, p.regolamento)}</p>`)}</div>
      </section>`;

  const sottotitolo = esc(REGOLAMENTI[p.regolamento])
    + (p.tempo && p.tempo.fine && !p.finita ? ` · <span role="timer" aria-label="Tempo rimasto" data-timer="${p.id}">${testoTimer(p)}</span>` : '');
  $('#vista').innerHTML = testata(`Manche ${numero}`, sottotitolo, '#/partita/' + id,
      n !== null ? `<button class="icon-btn" data-azione="elimina-manche" data-id="${id}" data-n="${n}" aria-label="Elimina questa manche">${ICO.cestino}</button>` : '')
    + `<div class="calc-testa">${testaCol}<div style="margin-top:12px">${segmenti('Modo di inserimento', [['auto', 'Calcolatrice'], ['manuale', 'Solo i totali']], manuale ? 'manuale' : 'auto', 'modo')}</div></div>`
    + corpo
    + `<p id="errore-manche" class="supporto errore" role="alert" style="color:#ffdad6"></p>`;
  azione(`<button class="btn fab" data-azione="salva-manche">${ICO.check}Salva manche</button>`, true);
}

function riepilogo(d, regolamento) {
  if (d.manuale) return 'totale scritto a mano';
  const R = regole(regolamento);
  const parti = [];
  if (d.puliti) parti.push(`${d.puliti}×${PUNTI.pulito}`);
  if (R.semipulito && d.semipuliti) parti.push(`${d.semipuliti}×${PUNTI.semipulito}`);
  if (d.sporchi) parti.push(`${d.sporchi}×${PUNTI.sporco}`);
  if (R.speciali && d.superb) parti.push(`${d.superb}×${PUNTI.superb}`);
  if (R.speciali && d.reali) parti.push(`${d.reali}×${PUNTI.reale}`);
  if (intero(d.terra)) parti.push(`${intero(d.terra)}`);
  if (d.chiusura) parti.push(`${PUNTI.chiusura}`);
  let s = parti.join(' + ');
  if (intero(d.mano)) s += `${s ? ' ' : ''}− ${intero(d.mano)}`;
  if (R.nonGiocato && intero(d.nonGiocato)) s += `${s ? ' ' : ''}− ${intero(d.nonGiocato)}`;
  if (d.pozzetto) s += `${s ? ' ' : ''}− ${PUNTI.pozzetto}`;
  return s || '—';
}

function aggiornaTotaleManche(i) {

}

async function apriConta(i, campo) {
  const p = trovaPartita(calc.id);
  const d = calc.dettagli[i];
  const chiave = 'conta' + campo[0].toUpperCase() + campo.slice(1);
  contaTemp = Object.assign({}, d[chiave] || {});
  const r = await dialogo({
    titolo: 'Conta le carte',
    testo: `${esc(nomeSquadra(p, i))} · ${{ terra: 'carte a terra', mano: 'carte in mano', nonGiocato: 'pozzetto preso e non giocato' }[campo]}`,
    html: `<div id="conta-box" style="margin-top:12px">${htmlConta()}</div>`,
    azioni: [{ testo: 'Annulla', valore: null }, { testo: 'Usa il totale', valore: 'ok' }]
  });
  if (r !== 'ok') return;
  d[chiave] = contaTemp;
  d[campo] = sommaCarte(contaTemp);
  $(`#i-${campo}-${i}`).value = d[campo] || '';
  aggiornaTotaleManche(i);
}

function salvaManche() {
  const p = trovaPartita(calc.id);
  if (!p) { calc = null; avviso('Questa partita è stata eliminata su un altro dispositivo'); vai('#/partite'); return; }
  const chiusi = calc.dettagli.filter(d => !d.manuale && d.chiusura).length;
  if (chiusi > 1) { $('#errore-manche').textContent = 'Può chiudere un solo giocatore o una sola coppia per manche.'; return; }
  const errChiusura = calc.dettagli.map(d => erroreChiusura(d, p.regolamento)).find(Boolean);
  if (errChiusura) { $('#errore-manche').textContent = errChiusura; return; }
  calc.dettagli.forEach(d => { if (d.chiusura) d.pozzetto = false; if (d.pozzetto) d.nonGiocato = 0; });
  const punti = calc.dettagli.map(d => puntiDettaglio(d, p.regolamento));
  const manche = { punti, dettagli: calc.dettagli.map(d => JSON.parse(JSON.stringify(d))) };
  const eraFinita = p.finita;
  if (calc.n === null) p.manche.push(manche); else p.manche[calc.n] = manche;
  p.aggiornata = Date.now();
  ricalcolaStato(p);
  salva();
  calc = null;
  vai('#/partita/' + p.id);
  tieniSchermoAcceso();
  if (p.finita && !eraFinita) annunciaVincitore(p);
  else avviso('Manche salvata');
}

async function annunciaVincitore(p) {
  const t = totali(p);
  const r = await dialogo({
    icona: ICO.trofeo,
    titolo: `${esitoBreve(p)}!`,
    testo: p.vincitore === null ? `${fmt(Math.max(...t))} punti a testa in ${p.manche.length} manche.` : `${fmt(t[p.vincitore])} punti in ${p.manche.length} manche.`,
    azioni: [{ testo: 'Rivincita', valore: 'rivincita' }, { testo: 'Vedi il riepilogo', valore: 'ok' }]
  });
  if (r === 'rivincita') rivincita(p.id);
}

function rivincita(id) {
  const p = trovaPartita(id);
  const q = { id: nuovoId(), creata: Date.now(), aggiornata: Date.now(), giocatori: p.giocatori.slice(), squadre: JSON.parse(JSON.stringify(p.squadre)), regolamento: p.regolamento, obiettivo: p.obiettivo, manche: [], finita: false, vincitore: null };
  if (p.tempo) q.tempo = nuovoTempo(p.tempo.smazzate, p.tempo.minuti);
  if (utente) q.utente = utente.id;
  dati.partite.push(q);
  salva();
  vai('#/partita/' + q.id);
}

async function cambiaTraguardo(id) {
  const p = trovaPartita(id);
  const v = await dialogo({
    titolo: 'Traguardo della partita',
    testo: 'A quanti punti si vince? Da regolamento sono 2005.',
    campo: { etichetta: 'Punti per vincere', valore: p.obiettivo, inputmode: 'numeric', valida: x => intero(x) >= 100 ? '' : 'Scrivi almeno 100 punti.' },
    azioni: [{ testo: 'Annulla', valore: null }, { testo: 'Salva', valore: 'ok' }]
  });
  if (v === null) return;
  const eraFinita = p.finita;
  p.obiettivo = intero(v);
  p.aggiornata = Date.now();
  ricalcolaStato(p);
  salva();
  vistaPartita(p.id);
  if (p.finita && !eraFinita) annunciaVincitore(p); else avviso('Ora si vince a ' + fmt(p.obiettivo));
}

// Le domande vanno alla funzione "chiedi" di Supabase, che usa la chiave Google tenuta segreta sul server.

const LIMITE_CHAT = 10;

/* Testo semplice → HTML: grassetto ed elenchi, tutto il resto escapato */
function mdLeggero(t) {
  let html = '', lista = false;
  for (const riga of esc(t).split('\n')) {
    const m = riga.match(/^\s*[-*•]\s+(.*)/);
    if (m) { if (!lista) { html += '<ul>'; lista = true; } html += `<li>${m[1]}</li>`; continue; }
    if (lista) { html += '</ul>'; lista = false; }
    if (riga.trim()) html += `<p>${riga.replace(/^#+\s*/, '')}</p>`;
  }
  if (lista) html += '</ul>';
  return html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

  const attesa = !m.testo && chat.inCorso && k === chat.vista.length - 1;
  return `<div class="fumetto assistente"><span class="sr">Risposta: </span>${attesa ? '<span class="sto-pensando">Sto cercando nel regolamento…</span>' : mdLeggero(m.testo)}</div>`;
}

async function chiediAlRegolamento(domanda) {
  domanda = domanda.trim();
  if (!domanda || chat.inCorso || !supa || !utente) return;
  // la conversazione fin qui: solo le coppie domanda-risposta andate a buon fine
  const storia = [];
  chat.vista.forEach((m, k) => {
    const dopo = chat.vista[k + 1];
    if (m.ruolo === 'utente' && dopo && dopo.ruolo === 'assistente' && dopo.testo) storia.push({ ruolo: 'utente', testo: m.testo }, { ruolo: 'assistente', testo: dopo.testo });
  });
  chat.inCorso = true;
  chat.vista.push({ ruolo: 'utente', testo: domanda }, { ruolo: 'assistente', testo: '' });
  if (location.hash === '#/chiedi') vistaChiedi();
  const risposta = chat.vista[chat.vista.length - 1];
  try {
    const { data } = await supa.auth.getSession();
    const r = await fetch(SUPABASE_URL + '/functions/v1/chiedi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session ? data.session.access_token : ''), apikey: SUPABASE_CHIAVE },
      body: JSON.stringify({ messaggi: [...storia.slice(-18), { ruolo: 'utente', testo: domanda }] })
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw Object.assign(new Error(e.errore || 'http ' + r.status), { codice: e.errore });
    }
    await leggiRisposta(r.body, testo => { risposta.testo += testo; aggiornaUltimoFumetto(); });
    if (!risposta.testo.trim()) throw Object.assign(new Error('vuota'), { codice: 'vuota' });
  } catch (e) {
    risposta.ruolo = 'errore';
    risposta.testo = messaggioChat(e);
  }
  chat.inCorso = false;
  if (location.hash === '#/chiedi') { vistaChiedi(); const t = $('#chat-testo'); if (t) t.focus(); }
}

/* La risposta arriva a pezzi (Server-Sent Events di Gemini): si mostra man mano */
async function leggiRisposta(corpo, suTesto) {
  const lettore = corpo.getReader();
  const decodifica = new TextDecoder();
  let resto = '';
  const usaRiga = riga => {
    if (!riga.startsWith('data:')) return;
    let d;
    try { d = JSON.parse(riga.slice(5)); } catch (e) { return; }
    if (d.promptFeedback && d.promptFeedback.blockReason) throw Object.assign(new Error('bloccata'), { codice: 'bloccata' });
    const parti = (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || [];
    const testo = parti.filter(p => p.text && !p.thought).map(p => p.text).join('');
    if (testo) suTesto(testo);
  };
  for (;;) {
    const { value, done } = await lettore.read();
    if (done) break;
    resto += decodifica.decode(value, { stream: true });
    const righe = resto.split('\n');
    resto = righe.pop();
    righe.forEach(usaRiga);
  }
  if (resto) usaRiga(resto);
}

function messaggioChat(e) {
  const testi = {
    limite: `Hai fatto le ${LIMITE_CHAT} domande di oggi: potrai farne altre domani.`,
    accesso: 'Devi accedere di nuovo al tuo account.',
    chiave_mancante: 'La chat non è ancora attiva: manca la chiave del servizio.',
    google_occupato: 'Il servizio è molto richiesto in questo momento: riprova tra un minuto.',
    google: 'Il servizio non ha risposto: riprova tra poco.',
    regolamenti: 'Non riesco a leggere i regolamenti: riprova tra poco.',
    bloccata: 'Non posso rispondere a questa domanda. Prova a riformularla.',
    vuota: 'Nessuna risposta, riprova.'
  };
  if (testi[e.codice]) return testi[e.codice];
  if (e instanceof TypeError) return 'Nessuna connessione: controlla internet e riprova.';
  return 'Qualcosa non ha funzionato: riprova tra poco.';
}

// Vince la versione modificata per ultima (campo "aggiornata", in millisecondi).
function programmaSincronizzazione() {
  if (!utente) return;
  clearTimeout(timerSync);
  timerSync = setTimeout(sincronizza, 1500);
}

function sincronizza() {
  if (!supa || !utente) return Promise.resolve();
  if (syncInCorso) { syncDaRifare = true; return syncInCorso; }
  clearTimeout(timerSync);
  impostaStatoSync('in-corso');
  syncInCorso = eseguiSincronizzazione(utente.id)
    .then(cambiate => { impostaStatoSync('ok'); if (cambiate) aggiornaVistaCorrente(); })
    .catch(e => impostaStatoSync(e.offline ? 'offline' : 'errore', e))
    .finally(() => {
      syncInCorso = null;
      if (syncDaRifare) { syncDaRifare = false; sincronizza(); }
    });
  return syncInCorso;
}

async function eseguiSincronizzazione(mio) {
  const controlla = r => {
    if (r.error) throw Object.assign(new Error(r.error.message), { offline: !r.status });
    return r.data;
  };
  const remote = controlla(await supa.from('partite').select('id, aggiornata, eliminata, dati'));
  if (!utente || utente.id !== mio) return false;
  const remoti = new Map(remote.map(r => [r.id, r]));
  const daRemota = r => Object.assign({}, r.dati, { aggiornata: r.aggiornata, utente: mio, sincronizzata: r.aggiornata });
  let cambiate = false;

  // 1. le mie partite su questo dispositivo: si carica la più recente, in un senso o nell'altro
  const daCaricare = [];
  for (const p of dati.partite.filter(q => q.utente === mio)) {
    const r = remoti.get(p.id);
    if (!r || p.aggiornata > r.aggiornata) daCaricare.push([p, p.aggiornata]);
    else if (r.aggiornata > p.aggiornata || r.eliminata) {
      dati.partite = dati.partite.filter(q => q !== p);
      if (!r.eliminata) dati.partite.push(daRemota(r));
      cambiate = true;
    } else p.sincronizzata = p.aggiornata;
  }
  // 2. partite eliminate qui: si comunica l'eliminazione, se nessuno le ha modificate dopo
  const daEliminare = [];
  dati.cancellate = dati.cancellate.filter(c => {
    if (c.utente !== mio) return true;
    const r = remoti.get(c.id);
    if (r && !r.eliminata && c.aggiornata >= r.aggiornata) { daEliminare.push(c); return true; }
    return false;
  });
  // 3. partite che esistono solo nel cloud (fatte su un altro dispositivo)
  const presenti = new Set(dati.partite.map(p => p.id));
  const inEliminazione = new Set(daEliminare.map(c => c.id));
  for (const r of remote) {
    if (!r.eliminata && !presenti.has(r.id) && !inEliminazione.has(r.id)) { dati.partite.push(daRemota(r)); cambiate = true; }
  }
  // 4. invio al cloud
  if (daCaricare.length) {
    controlla(await supa.from('partite').upsert(daCaricare.map(([p]) => rigaPartita(p, mio)), { onConflict: 'user_id,id' }));
    daCaricare.forEach(([p, versione]) => { p.sincronizzata = versione; });
  }
  for (const c of daEliminare) {
    controlla(await supa.from('partite').update({ eliminata: true, aggiornata: c.aggiornata }).eq('user_id', mio).eq('id', c.id));
    dati.cancellate = dati.cancellate.filter(x => x !== c);
  }
  scriviLocale();
  return cambiate;
}

/* Una riga della tabella: colonne leggibili per lo storico, più la partita completa in "dati" */
function rigaPartita(p, mio) {
  const { utente: _utente, sincronizzata: _sincronizzata, ...partita } = p;
  return {
    user_id: mio,
    id: p.id,
    creata_il: new Date(p.creata).toISOString(),
    aggiornata: p.aggiornata,
    eliminata: false,
    regolamento: p.regolamento,
    obiettivo: p.obiettivo,
    giocatori: p.giocatori,
    squadre: p.squadre.map((_, i) => nomeSquadra(p, i)),
    totali: totali(p),
    num_manche: p.manche.length,
    finita: !!p.finita,
    vincitore: !p.finita ? null : p.vincitore === null ? 'Pareggio' : nomeSquadra(p, p.vincitore),
    dati: partita
  };
}

function impostaStatoSync(stato, e) {

function testoStatoSync() {

  if (sync.stato === 'errore') return 'Salvataggio non riuscito: ' + sync.errore;
  if (sync.ultimo) return 'Tutto salvato nel cloud alle ' + sync.ultimo.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + '.';

}
